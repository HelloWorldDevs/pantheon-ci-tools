name: Delete Multidev on Merge

on:
  pull_request:
    types: [closed]

jobs:
  delete-multidev:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Terminus
        uses: pantheon-systems/terminus-github-actions@v1
        env:
          TERMINUS_ALLOW_UNSUPPORTED_NEWER_PHP: 1
        with:
          terminus-version: '4.3.4'
          pantheon-machine-token: ${{ secrets.TERMINUS_TOKEN }}

      - name: Delete Multidev Environment
        env:
          TERMINUS_ALLOW_UNSUPPORTED_NEWER_PHP: 1
          # Re-checked below: the setup action skips login without failing
          # when the secret is empty, which surfaced as "You are not logged in".
          TERMINUS_TOKEN: ${{ secrets.TERMINUS_TOKEN }}
          # Pantheon site machine name. TERMINUS_SITE (repo variable or
          # secret, same name the CircleCI jobs use) wins; PANTHEON_SITE is
          # still read for projects that set it up the old way.
          PANTHEON_SITE: "${{ vars.TERMINUS_SITE || secrets.TERMINUS_SITE || vars.PANTHEON_SITE }}"
          # Get branch name from PR event
          BRANCH: "${{ github.event.pull_request.head.ref || github.head_ref || github.ref_name }}"
          PR_NUMBER: "${{ github.event.pull_request.number }}"
        run: |
          echo "Original branch name: $BRANCH"
          if [ ! -f .ci/scripts/multidev-env-name.sh ]; then
            echo "::error::.ci/scripts/multidev-env-name.sh not found — run composer update helloworlddevs/pantheon-ci-tools and commit the result."
            exit 1
          fi
          # Same naming rules CI uses to create the multidev (Jira key, else pr-N).
          CLEAN_BRANCH=$(bash .ci/scripts/multidev-env-name.sh "$BRANCH" "$PR_NUMBER")
          if [ -z "${CLEAN_BRANCH}" ]; then
            echo "No multidev name derivable from branch '${BRANCH}'. Nothing to delete."
            exit 0
          fi
          echo "Multidev environment name: ${CLEAN_BRANCH}"
          if [ -z "${PANTHEON_SITE}" ]; then
            echo "::error::Set TERMINUS_SITE as a repository variable or secret (the Pantheon site machine name)."
            exit 1
          fi
          echo "Target Pantheon site: ${PANTHEON_SITE}"

          if ! terminus auth:whoami >/dev/null 2>&1; then
            if [ -z "${TERMINUS_TOKEN}" ]; then
              echo "::error::Terminus is not logged in. Set the TERMINUS_TOKEN repository secret (a Pantheon machine token)."
              exit 1
            fi
            terminus auth:login --machine-token="${TERMINUS_TOKEN}"
          fi

          # Check if the multidev environment exists (exact match)
          if terminus env:list "${PANTHEON_SITE}" --field=id | grep -qxF "${CLEAN_BRANCH}"; then
            echo "Multidev environment '${CLEAN_BRANCH}' found for site '${PANTHEON_SITE}'. Deleting..."
            terminus env:delete "${PANTHEON_SITE}.${CLEAN_BRANCH}" --delete-branch --yes --force
            echo "Deletion command executed for multidev '${CLEAN_BRANCH}'."
          else
            echo "No multidev environment named '${CLEAN_BRANCH}' found for site '${PANTHEON_SITE}'. Nothing to delete."
          fi

      - name: Post cleanup comment
        uses: actions/github-script@v6
        if: always()
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const hasExistingComment = comments.some(comment => 
              comment.user.login === 'github-actions[bot]' && 
              comment.body.includes('Multidev environment cleanup')
            );
            
            if (!hasExistingComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: 'Multidev environment cleanup completed.'
              });
            }
