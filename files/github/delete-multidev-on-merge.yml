name: Delete Multidev on Merge

on:
  pull_request:
    types: [closed]

jobs:
  delete-multidev:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Terminus
        uses: pantheon-systems/terminus-github-actions@v1
        env:
          TERMINUS_ALLOW_UNSUPPORTED_NEWER_PHP: 1
        with:
          terminus-version: '3.2.0'
          pantheon-machine-token: ${{ secrets.TERMINUS_TOKEN }}
      - name: Install Terminus Secrets Plugin
        env:
          TERMINUS_ALLOW_UNSUPPORTED_NEWER_PHP: 1
        run: terminus self:plugin:install pantheon-systems/terminus-secrets-plugin --yes

      - name: Delete Multidev Environment
        shell: bash
        env:
          TERMINUS_ALLOW_UNSUPPORTED_NEWER_PHP: 1
          # TERMINUS_TOKEN is used in the auth step above
          # IMPORTANT: Ensure PANTHEON_SITE is set in GitHub repo variables
          PANTHEON_SITE: "${{ vars.PANTHEON_SITE || 'your-site-name' }}"
          # Get branch name + PR number from the PR event.
          BRANCH: "${{ github.event.pull_request.head.ref || github.head_ref || github.ref_name }}"
          PR_NUMBER: "${{ github.event.pull_request.number || github.event.number }}"
        run: |
          set -euo pipefail
          echo "Branch: '${BRANCH}'  PR: '${PR_NUMBER:-<none>}'  Site: '${PANTHEON_SITE}'"

          # Normalize a string into a valid Pantheon env name the SAME way the
          # deploy does: lowercase, non-alnum -> '-', trim '-', max 11 chars.
          normalize() {
            echo "$1" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/^-*//;s/-*$//' | cut -c 1-11
          }

          # Build candidate env names in the SAME priority order that
          # setup_vars.sh / dev-multidev.sh use when NAMING the multidev:
          #   1) Jira ticket id from the branch (e.g. ADS-428 -> ads-428)
          #   2) PR number (pr-<number>)
          #   3) cleaned branch name (last-resort)
          CANDIDATES=()
          if echo "$BRANCH" | grep -qE '[A-Za-z]{1,10}-[0-9]+'; then
            TICKET=$(echo "$BRANCH" | grep -oE '[A-Za-z]{1,10}-[0-9]+' | head -1)
            CANDIDATES+=("$(normalize "$TICKET")")
          fi
          if [ -n "${PR_NUMBER:-}" ] && [ "${PR_NUMBER}" != "0" ]; then
            CANDIDATES+=("$(normalize "pr-${PR_NUMBER}")")
          fi
          CANDIDATES+=("$(normalize "$BRANCH")")

          echo "Candidate multidev names (priority order): ${CANDIDATES[*]}"

          # Snapshot existing envs once, then delete the FIRST candidate that
          # exists (skipping empties/duplicates).
          ENV_LIST=$(terminus env:list "${PANTHEON_SITE}" --field=id)
          DELETED=""
          SEEN=" "
          for ENV in "${CANDIDATES[@]}"; do
            [ -n "$ENV" ] || continue
            case "$SEEN" in *" $ENV "*) continue ;; esac
            SEEN="${SEEN}${ENV} "
            if echo "$ENV_LIST" | grep -qw "$ENV"; then
              echo "Found multidev '${ENV}' for '${PANTHEON_SITE}' — deleting..."
              terminus env:delete "${PANTHEON_SITE}.${ENV}" --delete-branch --yes --force
              echo "Deleted multidev '${ENV}'."
              DELETED="$ENV"
              break
            fi
            echo "No multidev named '${ENV}'."
          done

          if [ -z "$DELETED" ]; then
            echo "No matching multidev found for any candidate. Nothing to delete."
          fi

      - name: Post cleanup comment
        uses: actions/github-script@v6
        if: always()
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const hasExistingComment = comments.some(comment => 
              comment.user.login === 'github-actions[bot]' && 
              comment.body.includes('Multidev environment cleanup')
            );
            
            if (!hasExistingComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: 'Multidev environment cleanup completed.'
              });
            }
