version: 2.1

# ── Dynamic configuration entrypoint ─────────────────────────────────────────
# The root Composer script phpunit-ci opts a project into PHPUnit. Other projects use the
# Behat workflow, sized to the number of top-level feature files (1–12 boxes).
# Both workflows use the PHP minor from pantheon.yml.
setup: true

orbs:
  continuation: circleci/continuation@1.0.0

jobs:
  detect_config:
    docker:
    - image: cimg/base:current
    resource_class: small
    steps:
    - checkout
    - run:
        name: Select the test suite and parallelism
        command: |
          USE_PHPUNIT=false
          if [ -f composer.json ]; then
            USE_PHPUNIT=$(jq -r '(.scripts | objects // {}) | has("phpunit-ci")' composer.json)
          fi

          # Match the top-level feature files covered by the Behat runner.
          feature_count=0
          for feature in tests/behat/features/*.feature; do
            if [ -f "$feature" ]; then
              feature_count=$((feature_count + 1))
            fi
          done

          BEHAT_PARALLELISM=1
          if [ "$USE_PHPUNIT" = true ]; then
            if [ ! -f tests/phpunit.ci.xml ]; then
              echo "The phpunit-ci Composer script requires tests/phpunit.ci.xml for CI." >&2
              exit 1
            fi
            if [ "$feature_count" -gt 0 ]; then
              echo "The phpunit-ci Composer script selects PHPUnit, but tests/behat/features still has $feature_count top-level feature file(s)." >&2
              exit 1
            fi
          elif [ "$feature_count" -gt 0 ]; then
            BEHAT_PARALLELISM=$((feature_count < 12 ? feature_count : 12))
            echo "Behat: $feature_count feature file(s), parallelism $BEHAT_PARALLELISM."
          fi

          # PHP minor for every executor in continue_config.yml (build image
          # AND the Behat box) — read from pantheon.yml so CI runs the same PHP
          # the site runs on Pantheon. Falls back to 8.2 if absent/unparseable.
          PHP_VERSION="$(awk -F':[[:space:]]*' '/^php_version:/ {gsub(/["'"'"'[:space:]]/,"",$2); print $2; exit}' pantheon.yml 2>/dev/null || true)"
          if ! printf '%s' "${PHP_VERSION}" | grep -qE '^[0-9]+\.[0-9]+$'; then
            echo "No usable php_version in pantheon.yml (got '${PHP_VERSION:-}'); defaulting to 8.2."
            PHP_VERSION="8.2"
          fi
          echo "PHP version for CI executors: ${PHP_VERSION}"

          echo "{ \"use_phpunit\": ${USE_PHPUNIT}, \"behat_parallelism\": ${BEHAT_PARALLELISM}, \"php_version\": \"${PHP_VERSION}\" }" > /tmp/pipeline-parameters.json
          cat /tmp/pipeline-parameters.json
    - continuation/continue:
        configuration_path: .circleci/continue_config.yml
        parameters: /tmp/pipeline-parameters.json

workflows:
  setup:
    jobs:
    - detect_config
