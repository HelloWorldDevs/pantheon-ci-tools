version: 2.1

# ── Dynamic configuration entrypoint ─────────────────────────────────────────
# CircleCI runs THIS file first (setup: true). Its only job checks out the repo,
# detects whether the project ships Behat tests and which PHP minor the site
# runs (pantheon.yml), then "continues" into continue_config.yml — passing
# behat_parallelism and php_version. This lets behat_test provision 12
# executors ONLY when there are tests to shard (a Behat-less project gets
# parallelism 1, so it spins a single box that halts instead of 12), and lets
# every executor image track the project's PHP version.
#
# The real pipeline (executors, jobs, workflows) lives in continue_config.yml.
setup: true

orbs:
  continuation: circleci/continuation@1.0.0

jobs:
  detect_config:
    docker:
    - image: cimg/base:current
    resource_class: small
    steps:
    - checkout
    - run:
        name: Detect Behat tests and choose parallelism
        command: |
          # behat_test self-skips (circleci-agent step halt) when there's no
          # tests/behat, but parallelism is fixed at JOB-DEFINITION time — so a
          # static config still provisions all 12 boxes before any step runs.
          # Decide the count HERE, where we can see the repo, and pass it through.
          #
          # The runner (run-tests-circle) shards by TOP-LEVEL feature file, so
          # set parallelism to the feature-file count (1..12). This avoids
          # spinning 12 boxes for a 2-feature suite where 10 would sit idle.
          if [ -d tests/behat ]; then
            # Use find, not `ls *.feature | wc -l`: with no matches `ls` exits
            # non-zero and CircleCI's default `bash -eo pipefail` would abort the
            # whole setup job (no continuation → no pipeline). `find` exits 0.
            COUNT=$(find tests/behat/features -maxdepth 1 -name '*.feature' 2>/dev/null | wc -l | tr -d ' ')
            if [ "${COUNT}" -lt 1 ]; then COUNT=1; fi
            if [ "${COUNT}" -gt 12 ]; then COUNT=12; fi
            echo "Behat tests found (${COUNT} feature file(s)) — parallelism ${COUNT}."
            BEHAT_PARALLELISM=${COUNT}
          else
            echo "No tests/behat — behat_test will run on a single box."
            BEHAT_PARALLELISM=1
          fi

          # PHP minor for every executor in continue_config.yml (build image
          # AND the Behat box) — read from pantheon.yml so CI runs the same PHP
          # the site runs on Pantheon. Falls back to 8.2 if absent/unparseable.
          PHP_VERSION="$(awk -F':[[:space:]]*' '/^php_version:/ {gsub(/["'"'"'[:space:]]/,"",$2); print $2; exit}' pantheon.yml 2>/dev/null || true)"
          if ! printf '%s' "${PHP_VERSION}" | grep -qE '^[0-9]+\.[0-9]+$'; then
            echo "No usable php_version in pantheon.yml (got '${PHP_VERSION:-}'); defaulting to 8.2."
            PHP_VERSION="8.2"
          fi
          echo "PHP version for CI executors: ${PHP_VERSION}"

          echo "{ \"behat_parallelism\": ${BEHAT_PARALLELISM}, \"php_version\": \"${PHP_VERSION}\" }" > /tmp/pipeline-parameters.json
          cat /tmp/pipeline-parameters.json
    - continuation/continue:
        configuration_path: .circleci/continue_config.yml
        parameters: /tmp/pipeline-parameters.json

workflows:
  setup:
    jobs:
    - detect_config
