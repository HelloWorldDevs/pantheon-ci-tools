version: 2.1

# ── Dynamic configuration entrypoint ─────────────────────────────────────────
# CircleCI runs THIS file first (setup: true). Its only job checks out the repo,
# detects whether the project ships Behat tests, then "continues" into
# continue_config.yml — passing behat_parallelism. This lets behat_test
# provision 12 executors ONLY when there are tests to shard; a Behat-less
# project gets parallelism 1, so it spins a single box that halts instead of 12.
#
# The real pipeline (executors, jobs, workflows) lives in continue_config.yml.
setup: true

orbs:
  continuation: circleci/continuation@1.0.0

jobs:
  detect_config:
    docker:
    - image: cimg/base:current
    resource_class: small
    steps:
    - checkout
    - run:
        name: Detect Behat tests and choose parallelism
        command: |
          # behat_test self-skips (circleci-agent step halt) when there's no
          # tests/behat, but parallelism is fixed at JOB-DEFINITION time — so a
          # static config still provisions all 12 boxes before any step runs.
          # Decide the count HERE, where we can see the repo, and pass it through.
          if [ -d tests/behat ]; then
            echo "Behat tests found — using full parallelism (12)."
            BEHAT_PARALLELISM=12
          else
            echo "No tests/behat — behat_test will run on a single box."
            BEHAT_PARALLELISM=1
          fi
          echo "{ \"behat_parallelism\": ${BEHAT_PARALLELISM} }" > /tmp/pipeline-parameters.json
          cat /tmp/pipeline-parameters.json
    - continuation/continue:
        configuration_path: .circleci/continue_config.yml
        parameters: /tmp/pipeline-parameters.json

workflows:
  setup:
    jobs:
    - detect_config
