version: 2.1

orbs:
  jira: circleci/jira@2.2.0
  gh: circleci/github-cli@2.7.0
  slack: circleci/slack@5.1.1

executors:
  pantheon:
    docker:
    - image: quay.io/pantheon-public/build-tools-ci:8.x-php8.3
    working_directory: ~/project

  # Playwright VRT executor. We deliberately do NOT use Microsoft's
  # mcr.microsoft.com/playwright image: MCR aggressively rate-limits anonymous
  # pulls (toomanyrequests / unauthorized), which intermittently fails the job on
  # fresh CI hosts with no image cache. Instead we run on CircleCI's own
  # cimg/node (served from CircleCI's mirror, so not subject to those limits) and
  # let `npx playwright install --with-deps chromium` pull the matching browser +
  # OS libraries at runtime. Bonus: the browser version always matches the
  # @playwright/test version resolved from package-lock — no manual image-tag
  # sync. Trade-off: ~1–2 min added per run for the apt/browser install.
  playwright:
    docker:
    - image: cimg/node:lts
    working_directory: ~/project

  # Behat executor for running the suite against a DEPLOYED Pantheon env
  # (multidev on PRs, dev on master) — NOT a local Drupal install. No custom
  # image and no MariaDB service: the deployed environment IS the database.
  #   • Primary: build-tools-ci — PHP/Composer (runs vendor/bin/behat) plus
  #     drush + terminus, so the Drupal Behat driver can create @api fixtures on
  #     the remote env via remote drush (terminus-authenticated).
  #   • Secondary: a stock headless Chrome exposing the DevTools Protocol on
  #     :9222 for Mink (DMore ChromeExtension). The browser drives the PUBLIC
  #     env URL, so it needs no route back to the runner beyond CDP.
  behat:
    docker:
    - image: quay.io/pantheon-public/build-tools-ci:8.x-php8.3
    - image: zenika/alpine-chrome:123
      command:
      - --no-sandbox
      - --headless
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --window-size=1920,1080
      - about:blank
    working_directory: ~/project
    environment:
      TZ: "/usr/share/zoneinfo/America/Los_Angeles"
      ADMIN_USERNAME: admin

defaults: &defaults
  executor: pantheon
  working_directory: ~/project
  environment:
    TZ: "/usr/share/zoneinfo/America/Los_Angeles"
    NOTIFY: 'scripts/github/add-commit-comment {project} {sha} "Created multidev environment [{site}#{env}]({site-url}). Login with creds: username: admin, password: wh0C4r3s?" {site-url}'
    ADMIN_USERNAME: admin

jobs:
  # [job] Pre-flight guard: abort the pipeline early if Pantheon's multidev
  # cap is reached, instead of failing deep inside the deploy after a full
  # build. No-ops on the default branch (deploys to dev) and when no
  # ticket/PR maps to a multidev. Tunables: MAX_MULTIDEVS, DEFAULT_BRANCH.
  check_multidev_capacity:
    <<: *defaults
    resource_class: small
    steps:
    - checkout
    - run:
        name: Abort if Pantheon multidev capacity is reached
        command: |
          chmod +x ./.ci/scripts/check-multidev-capacity.sh
          ./.ci/scripts/check-multidev-capacity.sh

  # Main build and deploy job
  build_and_deploy:
    <<: *defaults
    resource_class: small
    parameters:
      # Deployment target recorded in the Jira issue's deployment panel. A URL
      # is fine; env vars (e.g. ${MULTIDEV_SITE_URL}/${DEV_SITE_URL}) expand at
      # runtime since build_and_deploy exports them to $BASH_ENV.
      jira_environment:
        type: string
        default: "${MULTIDEV_SITE_URL}"
      # Atlassian's deployment category is a FIXED enum — "multidev"/"dev" are
      # NOT accepted. We map: multidev → development, dev → staging.
      jira_environment_type:
        type: enum
        enum: ["production", "staging", "testing", "development", "unmapped"]
        default: "development"
    steps:
    # [setup] Checkout code and set up Docker
    - checkout
    - setup_remote_docker:
        docker_layer_caching: true
    # [vars][wet] Calculate environment URLs and variables
    - run:
        name: Setup environment and calculate URLs
        command: |
          # Run Pantheon environment setup
          /build-tools-ci/scripts/set-environment

          # Source the script to preserve environment variables
          source ./.ci/scripts/setup_vars.sh

          # Verify the variables were set correctly
          echo "Verification: Using TERMINUS_ENV: $TERMINUS_ENV"
          echo "Verification: Using MULTIDEV_SITE_URL: $MULTIDEV_SITE_URL"
          echo "Verification: Using DEV_SITE_URL: $DEV_SITE_URL"

          # Create the workspace directory if it doesn't exist
          mkdir -p /tmp/workspace

          # Write all variables to a single file for workspace and subsequent steps
          {
            # CircleCI variables
            echo "export CI_BUILD_URL='${CIRCLE_BUILD_URL}'"
            echo "export CI_NODE_INDEX='${CIRCLE_NODE_INDEX}'"
            echo "export CI_REPOSITORY_URL='${CIRCLE_REPOSITORY_URL}'"
            echo "export ARTIFACTS_DIR_URL='${CIRCLE_BUILD_URL}/artifacts/${CIRCLE_NODE_INDEX}/artifacts'"

            # Pantheon and site variables
            echo "export TERMINUS_SITE='$TERMINUS_SITE'"
            echo "export TERMINUS_ENV='$TERMINUS_ENV'"
            echo "export JIRA_TICKET_ID='$JIRA_TICKET_ID'"
            echo "export MULTIDEV_SITE_URL='$MULTIDEV_SITE_URL'"
            echo "export DEV_SITE_URL='$DEV_SITE_URL'"
            echo "export LIVE_SITE_URL='$LIVE_SITE_URL'"

            # Web-root + corrected theme path (computed by setup_vars.sh).
            # Exporting both means every later step (Load env, Verify,
            # Install, Build, Pantheon push, visual-regression job, etc.)
            # gets the same canonical values without re-detecting.
            echo "export WEB_ROOT='$WEB_ROOT'"
            echo "export THEME_PATH='$THEME_PATH'"
          } > /tmp/workspace/env_vars.sh

          # Also add to BASH_ENV for current job steps
          cat /tmp/workspace/env_vars.sh >> $BASH_ENV
          source $BASH_ENV

          echo "Saved environment variables to workspace:"
          cat /tmp/workspace/env_vars.sh
    # [build] Handle Composer dependencies
    - run:
        name: Clear Composer Cache
        command: |
          if [ -f "composer.json" ]; then
            composer clear-cache
          fi
    - run:
        name: Installing composer dependencies
        command: |
          if [ -f "composer.json" ]; then
            composer install --no-ansi --no-interaction --optimize-autoloader --no-progress
          else
            echo "No composer.json found, skipping composer install."
          fi
    # [cache] Save Composer cache
    - save_cache:
        key: composer-cache-v1-{{ checksum "composer.lock" }}
        paths:
        - $HOME/.composer/cache

    # Load environment variables from external file
    - run:
        name: Load environment variables
        command: |
          # Make the env vars script executable
          chmod +x ./.circleci/env_vars.sh
          # Source it into BASH_ENV for all steps
          echo 'source ./.circleci/env_vars.sh' >> $BASH_ENV
          # Re-run web-root detection AFTER env_vars.sh on every step. The
          # project's env_vars.sh may unconditionally `export THEME_PATH=...`
          # which would otherwise overwrite the corrected value from
          # setup_vars.sh. detect_web_root.sh is idempotent.
          echo 'source ./.ci/scripts/detect_web_root.sh' >> $BASH_ENV
          source $BASH_ENV

    # Verify required environment variables are set.
    # THEME_PATH normalization runs automatically via $BASH_ENV (see
    # setup_vars.sh + detect_web_root.sh); this step only sanity-checks the
    # final values and hard-fails before we try to `cd` into something
    # that doesn't exist.
    - run:
        name: Verify required theme variables are set
        command: |
          echo "WEB_ROOT=${WEB_ROOT:-<unset>}"
          echo "THEME_PATH=${THEME_PATH:-<unset>}"

          if [ -z "${THEME_PATH:-}" ]; then
            echo "ERROR: THEME_PATH environment variable is not set!"
            echo "Please set THEME_PATH in the CircleCI project settings or in .circleci/env_vars.sh"
            exit 1
          fi

          if [ ! -d "${THEME_PATH}" ]; then
            echo "ERROR: THEME_PATH does not exist on disk: ${THEME_PATH}"
            echo "Detected WEB_ROOT: ${WEB_ROOT:-<none>}"
            echo "Project layout (top-level):"
            ls -1 | sed 's/^/  /'
            exit 1
          fi

          if [ -z "${THEME_BUILD}" ]; then
            echo "ERROR: THEME_BUILD environment variable is not set!"
            echo "Please set THEME_BUILD in the CircleCI project settings or in .circleci/env_vars.sh"
            exit 1
          fi

          # Catch the common copy-paste bug where THEME_BUILD is set to
          # `npm install` (or duplicates THEME_INSTALL). The build "succeeds"
          # but produces no compiled assets, and the deploy ships an unstyled
          # site. Fail loudly here so the misconfiguration is obvious.
          if [ "${THEME_BUILD}" = "${THEME_INSTALL}" ] || \
             printf '%s' "${THEME_BUILD}" | grep -qE '^[[:space:]]*npm[[:space:]]+install([[:space:]]|$)'; then
            echo "ERROR: THEME_BUILD looks wrong — it's '${THEME_BUILD}'."
            echo "  THEME_BUILD should compile the theme (e.g. 'npm run build', 'gulp build')."
            echo "  THEME_INSTALL is what installs dependencies (e.g. 'npm install')."
            echo "  Fix THEME_BUILD in .circleci/env_vars.sh."
            exit 1
          fi

          # Validate every `npm run <script>` referenced anywhere in
          # THEME_BUILD actually exists in the theme's package.json. Catches
          # typos AND missing scripts in chained commands like
          # `npm ci && npm run build`. Scans the whole string, not just the
          # leading command, so a typo at the end still fails the build.
          if [ -f "${THEME_PATH}/package.json" ]; then
            npm_scripts="$(printf '%s' "${THEME_BUILD}" | grep -oE 'npm[[:space:]]+run[[:space:]]+[A-Za-z0-9_:.-]+' | awk '{print $NF}' | sort -u || true)"
            for s in ${npm_scripts}; do
              if ! grep -qE "\"${s}\"[[:space:]]*:" "${THEME_PATH}/package.json"; then
                echo "ERROR: THEME_BUILD references 'npm run ${s}' but no '${s}' script is defined in ${THEME_PATH}/package.json"
                echo "Available scripts:"
                grep -E '^\s+"[^"]+"\s*:\s*".*"' "${THEME_PATH}/package.json" | sed 's/^/  /' || true
                exit 1
              fi
            done
          fi

          echo "Required theme variables verified: THEME_PATH=${THEME_PATH}, THEME_INSTALL=${THEME_INSTALL}, THEME_BUILD=${THEME_BUILD}"

    # Build the theme for deployment to Pantheon.
    # NOTE: THEME_INSTALL/THEME_BUILD are invoked via `bash -c` so shell
    # operators inside the value (e.g. `npm ci && npm run build`) are parsed as
    # operators, not passed as literal args. With bare `${THEME_INSTALL}`
    # expansion they'd word-split and npm would silently receive `&&` as a
    # positional argument and skip everything after it.
    - run:
        name: Build theme
        command: |
          set -eo pipefail
          cd "${THEME_PATH}"
          bash -c "${THEME_INSTALL}"
          bash -c "${THEME_BUILD}"

    # Diagnostic: prove the build produced files before we try to ship them.
    # If styles ever go missing from a deploy, this output is the first
    # place to look — empty/missing artifacts here mean the build dropped
    # them; full output here but missing on prod means the deploy step
    # excluded them (see `git status` diagnostics below).
    - run:
        name: Theme build sanity check (post-build artifacts)
        command: |
          echo "Top-level contents of ${THEME_PATH}:"
          ls -la "${THEME_PATH}" | sed 's/^/  /'
          # Buffer find results to a file + truncate via awk to avoid
          # SIGPIPE/141 with high-volume output under `set -eo pipefail`.
          for d in dist build assets css js public; do
            if [ -d "${THEME_PATH}/${d}" ]; then
              echo
              echo "${THEME_PATH}/${d} ($(du -sh "${THEME_PATH}/${d}" | cut -f1)):"
              FIND_TMP="$(mktemp)"
              find "${THEME_PATH}/${d}" -maxdepth 3 -type f \( -name '*.css' -o -name '*.js' -o -name '*.map' \) > "${FIND_TMP}" 2>/dev/null || true
              awk 'NR<=40 {print "  " $0} END {if (NR>40) print "  ... (" NR-40 " more)"}' "${FIND_TMP}"
              rm -f "${FIND_TMP}"
            fi
          done

    # NOTE: don't hardcode a web-root path (e.g. web/themes/) here — projects
    # vary (web/ vs html/, per composer drupal-scaffold web-root). Built theme
    # assets are deployed to Pantheon via build:env:push, and the visual-
    # regression job tests the live multidev URL, so it doesn't need the theme
    # source in the workspace. Persist only what later jobs actually consume.
    - persist_to_workspace:
        root: .
        paths:
        - test_routes.json
    - run:
        name: Remove .gitignore files from theme directories
        command: |
          # Find and remove all .gitignore files in theme subdirectories
          if [ -n "${THEME_PATH}" ] && [ -d "${THEME_PATH}" ]; then
            echo "Removing .gitignore files from theme directory: ${THEME_PATH}"
            find ${THEME_PATH} -type f -name ".gitignore" -exec rm -f {} \;
            echo "Removed all .gitignore files from theme directories"
          else
            echo "Theme path not found or not defined. Skipping .gitignore removal."
          fi
    - run:
        name: Capture PR-changed config (before build rewrites git)
        environment:
          CONFIG_BASE_BRANCH: main
          CONFIG_SYNC_DIR: config/sync
          PR_CHANGED_FILE: /tmp/pr-changed-config.txt
          PR_BASE_DIR: /tmp/pr-base-config
        command: |
          # Snapshot which config/sync files the PR changed while the
          # checkout is still pristine. The later "Sync Drupal config from
          # prod" step reads this list — by then build:env:push has rewritten
          # git, so the diff can't be recomputed reliably.
          chmod +x ./.ci/scripts/config_split/capture-pr-config-changes.sh
          ./.ci/scripts/config_split/capture-pr-config-changes.sh
    - run:
        name: Preparing code for Pantheon
        command: |
          # Cutting root .gitignore so composer dependencies can be committed
          sed -i '1,/^# :::::::::::::::::::::: cut ::::::::::::::::::::::$/d' .gitignore

          # Diagnostic: surface any .gitignore rules that would still exclude
          # built theme assets. If files under THEME_PATH are listed here,
          # they WILL be missing from the Pantheon push — fix the matching
          # ignore rule (typically a `dist/`, `build/`, or `assets/` pattern
          # in a parent .gitignore that our theme-dir cleanup didn't touch).
          # Buffer to a file (no pipes!) so SIGPIPE from `head` can't kill
          # the build under `set -eo pipefail`.
          if [ -n "${THEME_PATH:-}" ] && [ -d "${THEME_PATH}" ]; then
            echo "Checking for .gitignore exclusions under ${THEME_PATH}..."
            IGNORED_TMP="$(mktemp)"
            git ls-files --others --ignored --exclude-standard "${THEME_PATH}" > "${IGNORED_TMP}" 2>/dev/null || true
            if [ -s "${IGNORED_TMP}" ]; then
              echo "⚠️  These built theme files are still .gitignore'd and WILL NOT deploy:"
              awk 'NR<=40 {print "    " $0} END {if (NR>40) print "    ... (" NR-40 " more)"}' "${IGNORED_TMP}"
              echo "    (Look for a parent-directory .gitignore with dist/, build/, or assets/ rules.)"
            else
              echo "  No .gitignore'd files under ${THEME_PATH}."
            fi
            rm -f "${IGNORED_TMP}"
          fi

          # Strip nested .git dirs BEFORE staging. Composer "source" installs
          # (dev/@dev branch packages like drupal/pdf:^1.0@dev) are git-cloned
          # rather than dist-unzipped, and some library installs (e.g.
          # web/libraries/dropzone) ship their own .git too. If they're still
          # present at `git add -A`, git records each as a gitlink (embedded
          # repo) instead of committing its files — so the package's code never
          # reaches the Pantheon artifact, and `drush config:import` later
          # fails with "Unable to install the <module> module since it does not
          # exist". -mindepth 2 protects the project's own top-level .git.
          echo "Stripping nested .git directories before staging..."
          NESTED_GIT="$(find . -mindepth 2 -name .git -prune 2>/dev/null || true)"
          if [ -n "${NESTED_GIT}" ]; then
            echo "${NESTED_GIT}" | sed 's/^/  removing: /'
            find . -mindepth 2 -name .git -prune -exec rm -rf {} + 2>/dev/null || true
          else
            echo "  none found."
          fi

          git add -A

          # Diagnostic: show what's about to be deployed so missing files
          # are obvious in the CI log without having to ssh to Pantheon.
          # Buffer to a file + truncate via awk (NOT `head`) to avoid the
          # SIGPIPE/141 trap with high-volume output under `pipefail`.
          STATUS_TMP="$(mktemp)"
          git status --short > "${STATUS_TMP}" 2>/dev/null || true
          STATUS_COUNT=$(wc -l < "${STATUS_TMP}" | tr -d ' ')
          echo "Files staged for deploy commit (${STATUS_COUNT} total, showing up to 80):"
          awk 'NR<=80 {print "  " $0} END {if (NR>80) print "  ... (" NR-80 " more)"}' "${STATUS_TMP}"
          rm -f "${STATUS_TMP}"

          git commit -m "Preparing code for deployment" || true
    - run:
        name: Deploying to Pantheon
        command: ./.ci/scripts/dev-multidev.sh
        no_output_timeout: 40m
    - run:
        name: Sync Drupal config from prod (preserving PR-modified files)
        no_output_timeout: 40m
        environment:
          CONFIG_BASE_BRANCH: main
          CONFIG_SYNC_DIR: config/sync
          CONFIG_SYNC_REPORT: /tmp/config-sync-report.md
          PR_CHANGED_FILE: /tmp/pr-changed-config.txt
          PR_BASE_DIR: /tmp/pr-base-config
        command: |
          chmod +x ./.ci/scripts/config_split/sync-prod-config.sh
          ./.ci/scripts/config_split/sync-prod-config.sh
    - run:
        name: Post config-sync report to PR (mirrored to Jira)
        when: always
        environment:
          CONFIG_SYNC_REPORT: /tmp/config-sync-report.md
        command: |
          chmod +x ./.ci/scripts/config_split/post_config_sync_comment.sh
          ./.ci/scripts/config_split/post_config_sync_comment.sh
    - run:
        name: Post config-sync report directly to Jira
        when: always
        environment:
          CONFIG_SYNC_REPORT: /tmp/config-sync-report.md
        command: |
          # Posts to Jira REST API directly so prod config drift lands on
          # the ticket even when no PR is associated, or when the
          # GitHub→Jira mirror workflow isn't installed. Requires
          # JIRA_BASE_URL / JIRA_USER / JIRA_TOKEN in a CircleCI context;
          # the script no-ops cleanly if any are missing.
          chmod +x ./.ci/scripts/config_split/post_config_sync_jira_comment.sh
          ./.ci/scripts/config_split/post_config_sync_jira_comment.sh
    - run:
        name: Post Multidev URL to GitHub PR
        command: ./.ci/scripts/post_multidev_url.sh
    # [notify][jira] Add the multidev URL to the Jira issue sidebar as a
    # remote link ("deployed to"). Idempotent via globalId — re-deploys
    # update the link instead of duplicating it. Needs JIRA_BASE_URL /
    # JIRA_USER / JIRA_TOKEN (same context as the config-sync Jira comment);
    # the script no-ops cleanly when creds or a real ticket ID are missing.
    - run:
        name: Link Multidev URL on Jira issue
        command: |
          chmod +x ./.ci/scripts/post_multidev_jira_link.sh
          ./.ci/scripts/post_multidev_jira_link.sh

    # Save environment variables and Git data for the test job
    - run:
        name: Prepare workspace
        command: |
          mkdir -p /tmp/workspace

          # Copy the entire working directory to the workspace
          # This includes the .git directory which is needed for Jira integration
          echo "Copying files to workspace..."
          cp -a . /tmp/workspace/

          # Make sure the .git directory exists
          if [ -d "/tmp/workspace/.git" ]; then
            echo "Git repository found in workspace"
            # Ensure Git is properly configured in the workspace
            cd /tmp/workspace
            git config --global --add safe.directory /tmp/workspace
            git config --global user.email "circleci@example.com"
            git config --global user.name "CircleCI"
          else
            echo "Warning: .git directory not found in workspace"
          fi

          # Save environment variables
          {
            echo "export TERMINUS_SITE='${TERMINUS_SITE}'"
            echo "export TERMINUS_ENV='${TERMINUS_ENV}'"
            echo "export MULTIDEV_SITE_URL='${MULTIDEV_SITE_URL}'"
            echo "export DEV_SITE_URL='${DEV_SITE_URL}'"
          } > /tmp/workspace/env_vars.sh

          # NOTE: We no longer stage compiled theme assets here. Behat now runs
          # against the DEPLOYED env (multidev/dev), which already serves the
          # theme that was built and pushed to Pantheon above — there is no local
          # site to style, so the workers don't need the compiled CSS/JS.

          # Debug: Show what we're saving
          echo "=== Workspace Contents ==="
          ls -la /tmp/workspace
          echo "\n=== Saved Environment Variables ==="
          cat /tmp/workspace/env_vars.sh
          echo "=================================="

    - persist_to_workspace:
        root: /tmp/workspace
        paths:
        - env_vars.sh
        - .ci/
        - .circleci/
        - .git/
        - test_routes.json

    # [notify][jira] Record this deploy in the Jira issue's deployment panel.
    # `environment` is the deployed URL (env vars expand at runtime); each
    # workflow passes the right URL + Atlassian category via job parameters
    # (PR → multidev URL/development, master → dev URL/staging). Needs the
    # JIRA_WEBHOOK_URL context. Last step so it reflects the job's outcome.
    - jira/notify:
        job_type: deployment
        environment: << parameters.jira_environment >>
        environment_type: << parameters.jira_environment_type >>
        pipeline_id: << pipeline.id >>
        pipeline_number: << pipeline.number >>

  # Playwright visual regression testing job
  playwright_visual_tests:
    executor: playwright
    resource_class: medium
    working_directory: /tmp/workspace
    parameters:
      # Which environments VRT compares. Snapshots are generated FROM the
      # reference (baseline); the target (new code) is compared against them.
      #   • PR flow (default): reference = dev,  target = multidev
      #   • master flow:        reference = prod, target = dev
      # URLs (env vars expand at runtime since env_vars.sh is sourced first).
      vrt_reference_url:
        type: string
        default: "${DEV_SITE_URL}"
      vrt_target_url:
        type: string
        default: "${MULTIDEV_SITE_URL}"
    environment:
      ARTIFACTS_FULL_DIR: /tmp/workspace/artifacts
    steps:
    # [persist][vars] Attach workspace to load saved environment variables and code
    - attach_workspace:
        at: /tmp/workspace
    # [setup] Set up Docker for running visual tests
    - setup_remote_docker:
        docker_layer_caching: true
    # [setup][notify] Install jq for Jira notifications. cimg/node runs as the
    # non-root `circleci` user (passwordless sudo), so apt needs sudo here.
    - run:
        name: Install jq
        command: sudo apt-get update && sudo apt-get install -y jq
    # [vars] Load environment variables from the workspace
    - run:
        name: Load environment variables
        command: |
          # Source the environment variables file
          if [ -f /tmp/workspace/env_vars.sh ]; then
            echo "Loading environment variables from workspace..."
            source /tmp/workspace/env_vars.sh
            # Add to BASH_ENV for subsequent steps
            cat /tmp/workspace/env_vars.sh >> $BASH_ENV
            source $BASH_ENV

            # Debug: Show key environment variables
            echo "DEV_SITE_URL: $DEV_SITE_URL"
            echo "MULTIDEV_SITE_URL: $MULTIDEV_SITE_URL"
          else
            echo "Warning: Environment variables file not found"
          fi

    # [guard] Wait for the multidev to wake before hitting it. Pantheon
    # appservers cold-start in 30–60s; without this the first screenshots
    # race the spin-up and flake. Runs first so the wait is explicit.
    - run:
        name: Check multidev is ready
        command: |
          chmod +x ./.ci/scripts/check-multidev.sh
          ./.ci/scripts/check-multidev.sh

    # [test] Run visual regression tests with Playwright. no_output_timeout
    # guards the install/first-run quiet stretches (browser extraction, the
    # screenshot stability loop) from CircleCI's default 10m no-output kill.
    - run:
        name: Run Playwright visual regression tests
        no_output_timeout: 20m
        command: |
          echo "Current directory: $(pwd)"
          cd /tmp/workspace/.ci/test/visual-regression
          # test_setup pre-installed the Chromium binary into the workspace
          # (.pw-browsers); point Playwright at it so we skip the slow CDN
          # download. install-deps still installs the OS libraries chromium
          # needs (apt, via sudo on cimg/node).
          export PLAYWRIGHT_BROWSERS_PATH=/tmp/workspace/.pw-browsers
          if [ ! -d node_modules ]; then
            echo "node_modules not in workspace — installing..."
            npm ci
          fi
          echo "Installing Chromium OS deps..."
          npx playwright install-deps chromium
          # No-op when test_setup already staged the browser; downloads as a
          # fallback if that pre-install was skipped or failed.
          npx playwright install chromium
          echo "Running Playwright tests..."
          # Per-workflow comparison targets (PR: dev↔multidev, master: prod↔dev).
          # Exported here so run-playwright picks them up; env vars in the param
          # values expand now (env_vars.sh was sourced above).
          export VRT_REFERENCE_URL="<< parameters.vrt_reference_url >>"
          export VRT_TARGET_URL="<< parameters.vrt_target_url >>"
          echo "VRT reference (baseline): $VRT_REFERENCE_URL"
          echo "VRT target (candidate):   $VRT_TARGET_URL"
          chmod +x ./run-playwright
          ./run-playwright

    # [artifacts] Store screenshots with visual comparison reports.
    # store_artifacts/store_test_results run even after a failed step by default,
    # so the diff report (what the Slack message links to) is captured on failure
    # too — no `when` needed (and `when` is redundant on these step types).
    - store_artifacts:
        path: /tmp/workspace/.ci/test/visual-regression/playwright-report

    # [artifacts] Store JUnit test results
    - store_test_results:
        path: /tmp/workspace/.ci/test/visual-regression/test-results

    # [notify] Build a Slack message naming the failed tests. Runs only on
    # failure; reads the list run-playwright wrote from the JSON report and
    # exports SLACK_FAILURE_TEXT (mrkdwn) for the slack/notify step below.
    - run:
        name: Summarize Playwright failures for Slack
        when: on_fail
        command: |
          cd /tmp/workspace/.ci/test/visual-regression || exit 0
          F=test-results/slack-failures.txt
          COUNT=0
          LIST=""
          if [ -s "$F" ]; then
            COUNT=$(grep -c . "$F" 2>/dev/null || echo 0)
            # Strip chars that would break the JSON string or re-trigger shell
            # expansion when sourced from BASH_ENV (" \ $ `), bullet each line,
            # then join with a LITERAL \n (Slack renders it as a newline).
            LIST=$(sed -e 's/[\\"$`]//g' "$F" \
                     | sed '/^[[:space:]]*$/d' \
                     | sed 's/^/• /' \
                     | awk 'NR==1{printf "%s",$0} NR>1{printf "\\n%s",$0}')
          fi
          [ -n "$LIST" ] || LIST="• (see the Playwright report in the Artifacts tab)"
          TEXT="*Visual regression failed:* ${CIRCLE_PROJECT_REPONAME} (${CIRCLE_BRANCH})\\n\\n*${COUNT} test(s) failed:*\\n${LIST}\\n\\n<${CIRCLE_BUILD_URL}|Open the CircleCI job> — full diff report is under the *Artifacts* tab."
          echo "export SLACK_FAILURE_TEXT=\"${TEXT}\"" >> "$BASH_ENV"
    # [notify] Notify Slack on failure with the named failures + report link.
    - slack/notify:
        event: fail
        channel: C06G970M5PF
        custom: |
          {
            "blocks": [
              {
                "type": "section",
                "text": { "type": "mrkdwn", "text": "${SLACK_FAILURE_TEXT}" }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "View job & diff report", "emoji": true },
                    "url": "${CIRCLE_BUILD_URL}"
                  }
                ]
              }
            ]
          }
    # [notify][jira] Report the VRT run to Jira as a BUILD (not a deployment) —
    # this job tests an already-deployed env, it doesn't deploy. The actual
    # deployment record is emitted by build_and_deploy.
    - jira/notify:
        job_type: build
        debug: true
        pipeline_id: << pipeline.id >>
        pipeline_number: << pipeline.number >>
  # Shared TEST SETUP (runs once, in parallel with the deploy): installs
  # everything the test jobs need and hands it to them via the workspace, so the
  # test jobs stay thin and don't each repeat slow installs/downloads.
  #   • Behat: `composer install` (incl. dev deps for vendor/bin/behat).
  #   • Playwright VRT: `npm ci` + the Chromium browser binary, installed into a
  #     project-local dir (.pw-browsers) so it rides the workspace to the VRT job.
  #     This is what stops Playwright re-downloading Chromium from the CDN on
  #     every run (the source of the "Too long with no output" timeouts).
  # Self-skips only when the project ships NEITHER tests/behat NOR a
  # visual-regression suite.
  test_setup:
    executor: pantheon
    resource_class: small
    steps:
    - checkout
    - run:
        name: Skip if project has no tests to set up
        command: |
          if [ ! -d tests/behat ] && [ ! -d .ci/test/visual-regression ]; then
            echo "No tests/behat and no .ci/test/visual-regression — nothing to set up."
            circleci-agent step halt
          fi
    # --- Behat deps (Composer) ---
    - restore_cache:
        keys:
        - composer-cache-v1-{{ checksum "composer.lock" }}
        - composer-cache-v1-
    - run:
        name: Composer install (includes dev deps for Behat)
        command: |
          if [ -d tests/behat ] && [ -f composer.json ]; then
            composer install --no-ansi --no-interaction --optimize-autoloader --no-progress
          else
            echo "No Behat suite or composer.json — skipping composer install."
          fi
    - save_cache:
        key: composer-cache-v1-{{ checksum "composer.lock" }}
        paths:
        - $HOME/.composer/cache
    # --- Playwright deps (npm + Chromium binary) ---
    # Browsers go in a project-local dir (.pw-browsers) so persist_to_workspace
    # carries them to the VRT job, which then skips the slow CDN download.
    # Pre-download is best-effort: if this image's Node is too old to run the
    # Playwright CLI, the VRT job has a guarded fallback install.
    - run:
        name: Install Playwright npm deps + Chromium
        no_output_timeout: 20m
        command: |
          if [ -d .ci/test/visual-regression ]; then
            export PLAYWRIGHT_BROWSERS_PATH="$PWD/.pw-browsers"
            cd .ci/test/visual-regression
            npm ci
            npx playwright install chromium || \
              echo "WARN: Chromium pre-download failed here; the VRT job will install it."
          else
            echo "No .ci/test/visual-regression — skipping Playwright setup."
          fi
    # Hand the whole built tree (vendor/, node_modules/, .pw-browsers/, tests/,
    # .ci/, behat.yml) to the test jobs.
    - persist_to_workspace:
        root: .
        paths:
        - .

  # Behat — RUN phase (parallelized): runs the suite against the DEPLOYED env.
  #
  # Attaches the Composer-built tree from test_setup, authenticates Terminus
  # (so the Drupal @api driver can create fixtures via remote drush on the
  # Pantheon env), waits for both the target env and the headless-Chrome service
  # to be ready, then runs the suite against the target URL. The target is the
  # multidev on PRs and dev on master, supplied via the behat_target_url
  # parameter. Self-skips when no tests/behat directory.
  behat_test:
    executor: behat
    resource_class: medium
    # parallelism: 1 (single container) — NOT sharded. The suite now runs
    # against ONE shared deployed env (multidev/dev), so its @api scenarios all
    # create fixtures in the SAME Pantheon database. Splitting across parallel
    # containers would have them race/clobber each other in that one DB (the old
    # 12-way split was only safe because each node had its own local install +
    # DB). Run serially against the shared env instead.
    parallelism: 1
    parameters:
      # Deployed environment the suite runs against. Env vars (e.g.
      # ${MULTIDEV_SITE_URL}/${DEV_SITE_URL}) expand at runtime from $BASH_ENV.
      behat_target_url:
        type: string
        default: "${MULTIDEV_SITE_URL}"
    steps:
    # Get the project source straight from git (guarantees the project-supplied
    # behat runner under .ci/test/behat/ — run-tests or run-tests-circle — and
    # the tests/ tree are present regardless of workspace layering).
    - checkout
    # Overlay the Composer-built artifacts (vendor/, composer-installed web/*)
    # from test_setup so the workers don't each re-run Composer.
    - attach_workspace:
        at: .
    - run:
        name: Skip if project has no tests/behat
        command: |
          if [ ! -d tests/behat ]; then
            echo "No tests/behat directory in this project — skipping Behat."
            circleci-agent step halt
          fi
    # Diagnostic: confirm the project runner (from checkout) and the Composer
    # build (from the workspace) are both present before we use them.
    - run:
        name: Verify Behat runner and vendor are present
        command: |
          # Accept whichever runner the project ships. Older projects have
          # `run-tests` (runs the whole suite); newer ones have `run-tests-circle`
          # (a CircleCI shard runner). At parallelism: 1 both run the full suite
          # identically — run-tests-circle's NR % CIRCLE_NODE_TOTAL math reduces
          # to "every file" when CIRCLE_NODE_TOTAL=1 — so either is fine. Prefer
          # run-tests (no `circleci tests glob` dependency); fall back to
          # run-tests-circle. The chosen path is exported for the run step.
          RUNNER=""
          for c in run-tests run-tests-circle; do
            if [ -f "./.ci/test/behat/$c" ]; then RUNNER="./.ci/test/behat/$c"; break; fi
          done
          if [ -z "$RUNNER" ]; then
            echo "ERROR: no Behat runner found in ./.ci/test/behat (looked for run-tests, run-tests-circle)."
            ls -la ./.ci/test/behat 2>/dev/null || echo "  (.ci/test/behat does not exist)"
            exit 1
          fi
          if [ ! -f ./vendor/bin/behat ]; then
            echo "ERROR: ./vendor/bin/behat is missing — test_setup's vendor/ did not arrive via the workspace."
            exit 1
          fi
          chmod +x ./.ci/test/behat/* 2>/dev/null || true
          echo "Using Behat runner: $RUNNER"
          echo "export BEHAT_RUNNER='$RUNNER'" >> "$BASH_ENV"
    # Authenticate Terminus and recompute the Pantheon site/env + URLs (the same
    # deterministic values build_and_deploy used). Remote drush — used by the
    # Drupal @api driver to create fixtures on the deployed env — needs this.
    - run:
        name: Authenticate Terminus & compute environment
        command: |
          set -eo pipefail
          terminus -n auth:login --machine-token="$TERMINUS_TOKEN"
          /build-tools-ci/scripts/set-environment
          source ./.ci/scripts/setup_vars.sh
          {
            echo "export TERMINUS_SITE='$TERMINUS_SITE'"
            echo "export TERMINUS_ENV='$TERMINUS_ENV'"
            echo "export MULTIDEV_SITE_URL='$MULTIDEV_SITE_URL'"
            echo "export DEV_SITE_URL='$DEV_SITE_URL'"
          } >> "$BASH_ENV"
    # Generate Pantheon drush site aliases (@pantheon.SITE.ENV) so the Drupal
    # Behat drush driver can target the remote env for @api fixtures.
    - run:
        name: Generate Pantheon drush aliases
        command: terminus aliases || true
    # Wait for the deployed env to wake (Pantheon appservers cold-start) before
    # hitting it, so spin-up latency doesn't leak into per-test flake.
    - run:
        name: Wait for the deployed environment to be ready
        command: |
          chmod +x ./.ci/scripts/check-multidev.sh
          ./.ci/scripts/check-multidev.sh "<< parameters.behat_target_url >>"
    # Wait for the headless-Chrome service container's DevTools endpoint.
    - run:
        name: Wait for headless Chrome (CDP)
        command: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9222/json/version >/dev/null 2>&1; then
              echo "Chrome CDP ready."; exit 0
            fi
            echo "  waiting for Chrome CDP ($i/30)..."; sleep 2
          done
          echo "ERROR: Chrome CDP not reachable on :9222"; exit 1
    - run:
        name: Create results dir
        command: mkdir -p ./tests/behat/results/junit
    # Run the suite against the deployed env. BEHAT_PARAMS is merged over the
    # project's behat.yml profile to (a) retarget Mink at the deployed URL,
    # (b) point the Chrome driver at the service container, and (c) route @api
    # fixtures through remote drush on the Pantheon env.
    - run:
        name: Run Behat against the deployed environment
        command: |
          set -eo pipefail
          TARGET_URL="<< parameters.behat_target_url >>"
          echo "Running Behat against: ${TARGET_URL}"
          export BEHAT_PARAMS="$(jq -n \
            --arg url "$TARGET_URL" \
            --arg alias "@pantheon.${TERMINUS_SITE}.${TERMINUS_ENV}" \
            '{
              extensions: {
                "Drupal\\MinkExtension": {
                  base_url: $url,
                  sessions: { default: { chrome: { api_url: "http://localhost:9222" } } }
                },
                "Drupal\\DrupalExtension": {
                  api_driver: "drush",
                  drush: { alias: $alias }
                }
              }
            }')"
          # Invoked via `bash` explicitly: some project runners use bash arrays
          # and/or ship without a shebang, so this avoids exec-bit/interpreter
          # surprises across images. BEHAT_RUNNER was resolved (run-tests vs
          # run-tests-circle) by the verify step above.
          bash "$BEHAT_RUNNER"
    # store_artifacts/store_test_results run even after a failed step by default,
    # so results/logs land on failure too — no `when` needed.
    - store_artifacts:
        path: ./tests/behat/results
        destination: artifacts
    - store_test_results:
        path: ./tests/behat/results
    # [notify] Build a Slack message naming the failed Behat scenarios. Runs
    # only on failure; parses the JUnit XML the runner wrote and exports
    # SLACK_FAILURE_TEXT (mrkdwn) for the slack/notify step below. Best-effort:
    # the Behat runner/format is project-supplied, so it falls back to a link.
    - run:
        name: Summarize Behat failures for Slack
        when: on_fail
        command: |
          RESULTS_DIR=./tests/behat/results
          COUNT=0
          LIST=""
          # The runner writes JUnit under results/junit/test_run_*/; search the
          # whole results tree, not just the top level.
          XMLS="$(find "${RESULTS_DIR}" -name '*.xml' 2>/dev/null)"
          if [ -n "$XMLS" ]; then
            # Pull the name="..." of every <testcase> that contains a <failure>
            # or <error>. Handles the common multi-line JUnit layout; self-closed
            # (passing) testcases are ignored.
            FAILED=$(awk '
              /<testcase/ {
                name=$0
                sub(/.*name="/, "", name)
                sub(/".*/, "", name)
                cur=name
                if ($0 ~ /\/>/) cur=""
              }
              /<(failure|error)/ { if (cur != "") { print cur; cur="" } }
            ' $XMLS 2>/dev/null | sort -u)
            if [ -n "$FAILED" ]; then
              COUNT=$(printf '%s\n' "$FAILED" | grep -c .)
              LIST=$(printf '%s\n' "$FAILED" \
                       | sed -e 's/[\\"$`]//g' \
                       | sed '/^[[:space:]]*$/d' \
                       | sed 's/^/• /' \
                       | awk 'NR==1{printf "%s",$0} NR>1{printf "\\n%s",$0}')
            fi
          fi
          [ -n "$LIST" ] || LIST="• (see the Behat results in the Artifacts tab)"
          TEXT="*Behat tests failed:* ${CIRCLE_PROJECT_REPONAME} (${CIRCLE_BRANCH})\\n\\n*${COUNT} scenario(s) failed:*\\n${LIST}\\n\\n<${CIRCLE_BUILD_URL}|Open the CircleCI job> — results are under the *Artifacts* tab."
          echo "export SLACK_FAILURE_TEXT=\"${TEXT}\"" >> "$BASH_ENV"
    # [notify] Notify Slack on failure with the named scenarios + report link.
    - slack/notify:
        event: fail
        channel: C06G970M5PF
        custom: |
          {
            "blocks": [
              {
                "type": "section",
                "text": { "type": "mrkdwn", "text": "${SLACK_FAILURE_TEXT}" }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "View job & results", "emoji": true },
                    "url": "${CIRCLE_BUILD_URL}"
                  }
                ]
              }
            ]
          }

# [workflows] Both flows now DEPLOY FIRST, then test the deployed env. Behat and
# Playwright run against the live Pantheon environment (no local install), so
# they validate post-deploy rather than gating it.
#
#   • pr_build_test (all branches EXCEPT master): deploy to the multidev, then
#     run Behat + Playwright against that multidev URL.
#
#   • master_deploy_then_test (master only → Pantheon dev): deploy to dev, then
#     run Behat against dev and Playwright (dev vs prod). NOTE: Behat no longer
#     gates the dev deploy — it can't, since it tests the deployed env.
#
# test_setup installs the test deps once (composer for Behat; npm + Chromium for
# Playwright) and runs in parallel with the deploy; behat_test and
# playwright_visual_tests each require BOTH the deploy (so the env exists) and
# test_setup (for vendor/ and the pre-staged browser). The jobs are defined once
# under `jobs:` and reused with different `requires`, branch filters, and target
# URLs.
workflows:
  # Feature-branch / PR flow: deploy to the multidev, then test it.
  pr_build_test:
    jobs:
    - check_multidev_capacity:
        filters:
          branches:
            ignore: master
        context:
        - GITHUB_TOKEN
        - JIRA_API_TOKEN
        - JIRA_WEBHOOK
    - build_and_deploy:
        filters:
          branches:
            ignore: master
        requires:
        - check_multidev_capacity
        # PR deploys land on the multidev; record it as a "development" deploy.
        jira_environment: "${MULTIDEV_SITE_URL}"
        jira_environment_type: development
        context:
        - GITHUB_TOKEN
        - JIRA_WEBHOOK_URL
    - playwright_visual_tests:
        filters:
          branches:
            ignore: master
        # Needs the deploy (env to screenshot) and test_setup (npm deps +
        # pre-staged Chromium in the workspace).
        requires:
        - build_and_deploy
        - test_setup
        context:
        - SLACK_ACCESS_TOKEN
        - JIRA_WEBHOOK_URL
        # Carries both VRT_USERNAME and VRT_PASSWORD for authenticated routes.
        - VRT_USERNAME
    # Shared test setup (composer + playwright deps) — runs in parallel with the deploy.
    - test_setup:
        filters:
          branches:
            ignore: master
        context:
        - GITHUB_TOKEN
        - SLACK_ACCESS_TOKEN
    # Runs the suite against the deployed multidev; needs the deploy (env exists)
    # and test_setup (vendor/).
    - behat_test:
        filters:
          branches:
            ignore: master
        requires:
        - build_and_deploy
        - test_setup
        behat_target_url: "${MULTIDEV_SITE_URL}"
        context:
        - GITHUB_TOKEN
        - SLACK_ACCESS_TOKEN

  # master flow: deploy to Pantheon dev, then test the deployed dev env.
  master_deploy_then_test:
    jobs:
    # Deploy to dev first. No multidev capacity check — master uses the existing
    # dev env, not a multidev.
    - build_and_deploy:
        filters:
          branches:
            only: master
        # master deploys to Pantheon's dev env; recorded as a "development"
        # deploy (Atlassian has no "dev" category — see job parameter notes).
        jira_environment: "${DEV_SITE_URL}"
        jira_environment_type: development
        context:
        - GITHUB_TOKEN
        - JIRA_WEBHOOK_URL
    # Shared test setup (composer + playwright deps) — runs in parallel with the deploy.
    - test_setup:
        filters:
          branches:
            only: master
        context:
        - GITHUB_TOKEN
        - SLACK_ACCESS_TOKEN
    # Behat against the freshly-deployed dev env (post-deploy validation).
    - behat_test:
        filters:
          branches:
            only: master
        requires:
        - build_and_deploy
        - test_setup
        behat_target_url: "${DEV_SITE_URL}"
        context:
        - GITHUB_TOKEN
        - SLACK_ACCESS_TOKEN
    # VRT after the dev deploy: compares the freshly-deployed DEV (candidate)
    # against PROD/LIVE (baseline) to catch visual regressions this release
    # introduces vs production. Runs after the deploy (doesn't block it).
    - playwright_visual_tests:
        filters:
          branches:
            only: master
        # Needs the deploy (env to screenshot) and test_setup (npm deps +
        # pre-staged Chromium in the workspace).
        requires:
        - build_and_deploy
        - test_setup
        vrt_reference_url: "${LIVE_SITE_URL}"
        vrt_target_url: "${DEV_SITE_URL}"
        context:
        - SLACK_ACCESS_TOKEN
        - JIRA_WEBHOOK_URL
        - VRT_USERNAME
